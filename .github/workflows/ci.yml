# Continuous Integration — runs on every push to main and on every PR.
# Purpose: catch breakage early. On push to main, also publishes a rolling
# `:latest` and `:main-<sha>` Docker image to Docker Hub.
name: CI

on:
  push:
    branches: [main]
    # Skip CI when a push only touches docs or runtime config.
    # Dockerfile is intentionally NOT ignored — it affects how the image builds.
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - 'docker-compose.yml'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - 'docker-compose.yml'
      - '.gitignore'
      - '.gitattributes'

# Cancel older runs on the same branch when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The Docker Hub repository to publish to. Change once if you ever rename.
env:
  DOCKERHUB_IMAGE: hamed0406/ding

jobs:
  rust:
    name: Rust scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: scanner
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          workspaces: scanner -> target

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --release
      - run: cargo test --release

  go:
    name: Go controller
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: controller
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version: '1.25'
          cache-dependency-path: controller/go.sum

      # go:embed needs static/ to be non-empty at compile time.
      # The Dockerfile fills this from ui/dist; in CI we drop a placeholder
      # so the package compiles for vet/test purposes.
      - name: Seed embed placeholder
        run: |
          mkdir -p internal/api/static
          echo "ci-placeholder" > internal/api/static/index.html

      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...

  ui:
    name: React UI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'
          # No `cache: npm` here: package-lock.json is not committed,
          # and setup-node requires a lockfile to compute the cache key.

      # Use install (not ci) — matches the Dockerfile, which uses install
      # because package-lock.json is not committed.
      - run: npm install
      - run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [rust, go, ui]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      # Only log in to Docker Hub when this is a push to main.
      # PRs (especially from forks) cannot read repo secrets and would fail.
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          username: hamed0406
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Compute tags. On main → :latest + :main-<short-sha>. On PR → ding:ci (local only).
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=main-,enable={{is_default_branch}}

      # Build always (PR smoke build), push only on main.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: false
          tags: ${{ steps.meta.outputs.tags || 'ding:ci' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test-ui:
    name: UI component tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: [go, ui]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version: '1.25'
          cache-dependency-path: controller/go.sum

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'

      - name: Build UI
        working-directory: ui
        run: npm install && npm run build

      - name: Copy UI to embed dir
        run: |
          mkdir -p controller/internal/api/static
          cp -r ui/dist/* controller/internal/api/static/

      - name: Build Go binary
        working-directory: controller
        run: go build -o /tmp/ding-e2e ./cmd/ding

      - name: Make fake scanner executable
        run: chmod +x scripts/fake-scanner

      - name: Start server
        run: |
          DING_SCANNER_BIN=${{ github.workspace }}/scripts/fake-scanner \
          DING_SCAN_INTERVAL="" \
          DING_HTTP_ADDR=:8081 \
          DING_DATA_PATH=/tmp/ding-e2e.db \
          /tmp/ding-e2e &
          echo $! > /tmp/ding-e2e.pid

      - name: Wait for server
        run: |
          for i in $(seq 1 20); do
            curl -sf http://localhost:8081/api/auth/providers && break
            echo "Waiting… ($i)"
            sleep 1
          done

      - name: Install Playwright
        working-directory: e2e
        run: npm install && npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: e2e
        run: npm test

      - name: Stop server
        if: always()
        run: kill $(cat /tmp/ding-e2e.pid) 2>/dev/null || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
