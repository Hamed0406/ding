# Release pipeline — fires when you push a semver tag like v1.2.3.
#
# Jobs:
#   ui         — build React UI once; shared by Go controller builds
#   scanner    — build Rust scanner for Linux + Windows
#   controller — build Go controller for Linux + Windows; needs ui
#   release    — package archives, attach to GitHub Release
#   docker     — multi-arch Docker image → Docker Hub + GHCR
#
# Required repo secrets:
#   DOCKERHUB_TOKEN — Docker Hub access token
#
# How to cut a release:
#   git tag v1.2.3 && git push origin v1.2.3

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

env:
  DOCKERHUB_IMAGE: hamed0406/ding

jobs:
  ui:
    name: UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - run: npm install
        working-directory: ui

      - run: npm run build
        working-directory: ui

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-dist
          path: ui/dist/

  scanner:
    name: Scanner (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-amd64

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: linux-arm64
            apt: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-amd64

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: scanner -> target
          key: ${{ matrix.target }}

      - name: Install ARM64 cross-linker
        if: matrix.apt
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}

      - name: Install Npcap SDK Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-sdk-1.13.zip" `
            -OutFile npcap-sdk.zip
          Expand-Archive npcap-sdk.zip npcap-sdk
          $lib = "${{ github.workspace }}\npcap-sdk\Lib\x64"
          "LIB=$lib;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build scanner
        working-directory: scanner
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}

      - name: Upload Unix
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scanner-${{ matrix.artifact }}
          path: scanner/target/${{ matrix.target }}/release/scanner

      - name: Upload Windows
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scanner-${{ matrix.artifact }}
          path: scanner/target/${{ matrix.target }}/release/scanner.exe

  controller:
    name: Controller (${{ matrix.artifact }})
    needs: ui
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact: linux-amd64

          - goos: linux
            goarch: arm64
            artifact: linux-arm64

          - goos: windows
            goarch: amd64
            artifact: windows-amd64
            ext: .exe

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25'
          cache-dependency-path: controller/go.sum

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ui-dist
          path: controller/internal/api/static/

      - name: Build controller
        working-directory: controller
        run: |
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -ldflags="-s -w" -o ding${{ matrix.ext || '' }} ./cmd/ding

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: controller-${{ matrix.artifact }}
          path: controller/ding${{ matrix.ext || '' }}

  release:
    name: GitHub Release
    needs: [scanner, controller]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts/

      - name: Package archives
        run: |
          mkdir -p dist

          for platform in linux-amd64 linux-arm64; do
            mkdir -p pkg
            cp artifacts/scanner-${platform}/scanner pkg/scanner
            cp artifacts/controller-${platform}/ding pkg/ding
            chmod +x pkg/scanner pkg/ding
            tar -czf dist/ding-${platform}.tar.gz -C pkg scanner ding
            rm -rf pkg
          done

          mkdir -p pkg
          cp artifacts/scanner-windows-amd64/scanner.exe pkg/scanner.exe
          cp artifacts/controller-windows-amd64/ding.exe pkg/ding.exe
          zip -j dist/ding-windows-amd64.zip pkg/scanner.exe pkg/ding.exe
          rm -rf pkg

          cd dist && sha256sum * > sha256sums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/sha256sums.txt
          body: |
            ## Docker recommended for Linux

            ```bash
            docker pull ${{ env.DOCKERHUB_IMAGE }}:${{ github.ref_name }}
            docker pull ghcr.io/${{ github.repository_owner }}/ding:${{ github.ref_name }}
            ```

            ## Native binaries

            | Platform | Archive | Notes |
            |---|---|---|
            | Linux x86_64 | `ding-linux-amd64.tar.gz` | |
            | Linux ARM64 | `ding-linux-arm64.tar.gz` | Raspberry Pi, NAS |
            | Windows x86_64 | `ding-windows-amd64.zip` | Requires Npcap + run as Administrator |

            Each archive contains two binaries: `scanner` Rust + `ding` Go controller with UI embedded.

            **Verify download:**
            ```bash
            sha256sum -c sha256sums.txt
            ```

            **Quick start Linux:**
            ```bash
            tar xzf ding-linux-amd64.tar.gz
            sudo ./ding
            # UI at http://localhost:8081
            ```

            **Quick start Windows:**
            1. Install Npcap
            2. Unzip `ding-windows-amd64.zip`
            3. Run `ding.exe` as Administrator

            ---

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: hamed0406
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ghcr.io/${{ github.repository_owner }}/ding
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=ding
            org.opencontainers.image.description=Hybrid Rust+Go network scanner
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
