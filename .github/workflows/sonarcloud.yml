name: SonarCloud analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  Analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version: '1.25'
          cache-dependency-path: controller/go.sum

      - name: Seed embed placeholder
        run: |
          mkdir -p controller/internal/api/static
          echo "ci-placeholder" > controller/internal/api/static/index.html

      - name: Run Go tests with coverage
        working-directory: controller
        run: go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: Analyze with SonarCloud
        uses: SonarSource/sonarcloud-github-action@4006f663ecaf1f8093e8e4abb9227f6041f52216
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=Hamed0406_ding
            -Dsonar.organization=hamed0406
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.go.coverage.reportPaths=controller/coverage.out
            -Dsonar.sources=controller,scanner/src,ui/src
            -Dsonar.tests=controller,e2e
            -Dsonar.test.inclusions=**/*_test.go,**/*.spec.ts,**/*.test.ts,**/*.test.tsx
            -Dsonar.exclusions=**/node_modules/**,**/target/**,**/dist/**,controller/internal/api/static/**,scripts/**,**/*_test.go
            -Dsonar.coverage.exclusions=scripts/**,e2e/**,**/*_test.go
          projectBaseDir: .
