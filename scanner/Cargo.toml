[package]
name = "ding-scanner"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "scanner"
path = "src/main.rs"

[dependencies]
pnet = "0.35"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
dns-parser = "0.8"
socket2 = { version = "0.5", features = ["all"] }
