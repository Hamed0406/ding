sonar.organization=hamed0406
sonar.projectKey=Hamed0406_ding
sonar.host.url=https://sonarcloud.io

# Source roots — exclude generated/vendored/test directories
sonar.sources=controller,scanner/src,ui/src
sonar.tests=controller,e2e
sonar.test.inclusions=**/*_test.go,**/*.spec.ts,**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/node_modules/**,**/target/**,**/dist/**,controller/internal/api/static/**,scripts/**,**/*_test.go

# Go coverage (generated in CI before analysis)
sonar.go.coverage.reportPaths=controller/coverage.out
sonar.coverage.exclusions=scripts/**,e2e/**,**/*_test.go

sonar.sourceEncoding=UTF-8
